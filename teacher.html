<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سنتر الأوائل - نظام متابعة الطلاب وأولياء الأمور</title>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            accent: {
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 selection:bg-blue-900 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 sm:right-auto sm:left-6 sm:w-96 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Confirmation / Edit Modal Backdrop -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden items-center justify-center p-4 transition-opacity">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 fade-in border border-slate-100">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/95 z-50 flex flex-col items-center justify-center gap-4">
    <div class="w-14 h-14 border-4 border-blue-900 border-t-teal-500 rounded-full animate-spin"></div>
    <p class="text-blue-900 font-bold text-lg">جاري تحميل النظام والبيانات...</p>
  </div>

  <!-- Main App Root -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Firebase & Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ==========================================
    // 1. Firebase Configuration & Initialization
    // ==========================================
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'student-tracker-default';
    let firebaseConfig = null;
    try {
      firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    } catch (e) {
      console.error("Invalid firebase config", e);
    }

    let db = null;
    let auth = null;
    let currentUser = null;
    let isCloudConnected = false;

    // Collection References Helpers (Rule 1: Strict Paths)
    const getPublicCol = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
    const getPublicDoc = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

    // ==========================================
    // 2. Application State
    // ==========================================
    const DEFAULT_SUBJECTS = [
      { name: 'القرآن الكريم', icon: 'fa-book-quran' },
      { name: 'اللغة العربية', icon: 'fa-pen-nib' },
      { name: 'الرياضيات', icon: 'fa-calculator' },
      { name: 'اللغة الإنجليزية', icon: 'fa-language' },
      { name: 'الدراسات الاجتماعية', icon: 'fa-globe-africa' },
      { name: 'التاريخ', icon: 'fa-landmark' },
      { name: 'العلوم', icon: 'fa-flask' }
    ];

    const GRADES = [
      'الأول الابتدائي', 'الثاني الابتدائي', 'الثالث الابتدائي',
      'الرابع الابتدائي', 'الخامس الابتدائي', 'السادس الابتدائي',
      'الأول الإعدادي', 'الثاني الإعدادي', 'الثالث الإعدادي',
      'الأول الثانوي', 'الثاني الثانوي', 'الثالث الثانوي'
    ];

    const state = {
      view: 'login', // 'login' | 'admin' | 'parent'
      loginTab: 'parent', // 'parent' | 'admin'
      adminTab: 'parents', // 'parents' | 'students' | 'tracking'
      
      // Data collections
      settings: {
        centerName: 'سنتر الأوائل التعليمي',
        adminUsername: 'admin',
        adminPassword: '1234',
        customSubjects: []
      },
      parents: [],
      students: [],

      // Active sessions
      loggedParentId: null,
      selectedChildId: null,
      selectedParentSubject: null,

      // Admin filters & selections
      parentSearch: '',
      studentSearch: '',
      studentGradeFilter: '',
      trackingGradeFilter: '',
      trackingStudentId: '',
      trackingSubject: '',
      
      // Toggle forms in Admin
      showAddParentForm: false,
      showAddStudentForm: false,
      loginError: ''
    };

    // ==========================================
    // 3. UI Helpers (Toasts & Modals)
    // ==========================================
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-700',
        error: 'bg-rose-600 text-white border-rose-700',
        info: 'bg-blue-900 text-white border-blue-950'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        info: 'fa-circle-info'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl shadow-xl border text-sm font-bold fade-in`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg shrink-0"></i>
        <span class="flex-1 leading-relaxed">${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3200);
    };

    window.openModal = function(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    };

    window.closeModal = function() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    };

    // Close modal when clicking outside
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // ==========================================
    // 4. Data Operations & Seeding
    // ==========================================
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
    }

    function createDefaultSubjectRecord(subjectName) {
      return {
        subjectName,
        attendance: {
          status: 'لم يتم التسجيل',
          lastDate: '',
          presentCount: 0,
          totalCount: 0,
          history: []
        },
        homework: {
          status: 'لم يتم التسجيل',
          level: 'لم يتم التقييم',
          notes: ''
        },
        exams: {
          latestName: '',
          latestScore: null,
          latestMax: null,
          history: []
        },
        fees: {
          due: 0,
          paid: 0
        }
      };
    }

    async function seedInitialDataIfEmpty() {
      if (!isCloudConnected || !currentUser) return;
      try {
        const settingsRef = getPublicDoc('system_settings', 'main');
        const settingsSnap = await getDoc(settingsRef);
        
        if (!settingsSnap.exists()) {
          // 1. Save default settings
          await setDoc(settingsRef, {
            centerName: 'سنتر الأوائل التعليمي',
            adminUsername: 'admin',
            adminPassword: '1234',
            customSubjects: []
          });

          // 2. Create Demo Parent (has 2 children)
          const demoParentId = 'parent_demo_1';
          await setDoc(getPublicDoc('parents', demoParentId), {
            id: demoParentId,
            name: 'محمد عبدالواحد',
            phone: '01012345678',
            password: '1234',
            createdAt: new Date().toISOString()
          });

          // 3. Create Demo Child 1
          const child1Id = 'student_demo_1';
          await setDoc(getPublicDoc('students', child1Id), {
            id: child1Id,
            name: 'تاليا محمد عبدالواحد',
            grade: 'الأول الإعدادي',
            parentId: demoParentId,
            subjects: ['القرآن الكريم', 'اللغة العربية', 'الرياضيات'],
            records: {
              'القرآن الكريم': {
                subjectName: 'القرآن الكريم',
                attendance: {
                  status: 'حاضر',
                  lastDate: new Date().toISOString().split('T')[0],
                  presentCount: 8,
                  totalCount: 8,
                  history: [{ date: new Date().toISOString().split('T')[0], status: 'حاضر' }]
                },
                homework: {
                  status: 'ممتاز',
                  level: 'ممتاز',
                  notes: 'حفظ متقن وتلاوة ممتازة ما شاء الله.'
                },
                exams: {
                  latestName: 'اختبار جزء عمّ',
                  latestScore: 20,
                  latestMax: 20,
                  history: [{ name: 'اختبار جزء عمّ', score: 20, max: 20, date: new Date().toISOString().split('T')[0] }]
                },
                fees: { due: 200, paid: 200 }
              },
              'اللغة العربية': {
                subjectName: 'اللغة العربية',
                attendance: {
                  status: 'حاضر',
                  lastDate: new Date().toISOString().split('T')[0],
                  presentCount: 7,
                  totalCount: 8,
                  history: [{ date: new Date().toISOString().split('T')[0], status: 'حاضر' }]
                },
                homework: {
                  status: 'ممتاز',
                  level: 'جيد جداً',
                  notes: 'متميزة في النحو، يُرجى التركيز أكثر على التعبير.'
                },
                exams: {
                  latestName: 'تقييم الشهر الأول',
                  latestScore: 28,
                  latestMax: 30,
                  history: [{ name: 'تقييم الشهر الأول', score: 28, max: 30, date: new Date().toISOString().split('T')[0] }]
                },
                fees: { due: 250, paid: 150 }
              },
              'الرياضيات': createDefaultSubjectRecord('الرياضيات')
            },
            createdAt: new Date().toISOString()
          });

          // 4. Create Demo Child 2
          const child2Id = 'student_demo_2';
          await setDoc(getPublicDoc('students', child2Id), {
            id: child2Id,
            name: 'مالك محمد عبدالواحد',
            grade: 'الثاني الابتدائي',
            parentId: demoParentId,
            subjects: ['القرآن الكريم', 'الرياضيات', 'اللغة الإنجليزية'],
            records: {
              'القرآن الكريم': createDefaultSubjectRecord('القرآن الكريم'),
              'الرياضيات': {
                subjectName: 'الرياضيات',
                attendance: {
                  status: 'حاضر',
                  lastDate: new Date().toISOString().split('T')[0],
                  presentCount: 6,
                  totalCount: 6,
                  history: [{ date: new Date().toISOString().split('T')[0], status: 'حاضر' }]
                },
                homework: {
                  status: 'جيد',
                  level: 'ممتاز',
                  notes: 'ممتاز في جدول الضرب والحساب الذهني.'
                },
                exams: {
                  latestName: 'اختبار الوحدة الأولى',
                  latestScore: 19,
                  latestMax: 20,
                  history: [{ name: 'اختبار الوحدة الأولى', score: 19, max: 20, date: new Date().toISOString().split('T')[0] }]
                },
                fees: { due: 200, paid: 200 }
              },
              'اللغة الإنجليزية': {
                subjectName: 'اللغة الإنجليزية',
                attendance: {
                  status: 'متأخر',
                  lastDate: new Date().toISOString().split('T')[0],
                  presentCount: 5,
                  totalCount: 6,
                  history: [{ date: new Date().toISOString().split('T')[0], status: 'متأخر' }]
                },
                homework: {
                  status: 'ممتاز',
                  level: 'جيد جداً',
                  notes: 'نطق ممتاز للكلمات الجديدة.'
                },
                exams: {
                  latestName: 'امتحان كلمات الوحدة',
                  latestScore: 14,
                  latestMax: 15,
                  history: [{ name: 'امتحان كلمات الوحدة', score: 14, max: 15, date: new Date().toISOString().split('T')[0] }]
                },
                fees: { due: 200, paid: 100 }
              }
            },
            createdAt: new Date().toISOString()
          });
        }
      } catch (err) {
        console.error("Error seeding initial data:", err);
      }
    }

    function setupRealtimeListeners() {
      if (!isCloudConnected || !currentUser) return;

      // 1. Settings listener
      onSnapshot(getPublicDoc('system_settings', 'main'), (docSnap) => {
        if (docSnap.exists()) {
          state.settings = { ...state.settings, ...docSnap.data() };
          render();
        }
      }, (err) => console.error("Settings snapshot error:", err));

      // 2. Parents listener
      onSnapshot(getPublicCol('parents'), (snapshot) => {
        const list = [];
        snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        state.parents = list;
        render();
      }, (err) => console.error("Parents snapshot error:", err));

      // 3. Students listener
      onSnapshot(getPublicCol('students'), (snapshot) => {
        const list = [];
        snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        state.students = list;
        render();
      }, (err) => console.error("Students snapshot error:", err));
    }

    async function initApp() {
      try {
        if (firebaseConfig) {
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          auth = getAuth(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, async (user) => {
            if (user) {
              currentUser = user;
              isCloudConnected = true;
              await seedInitialDataIfEmpty();
              setupRealtimeListeners();
              document.getElementById('loading-overlay').classList.add('hidden');
              render();
            }
          });
        } else {
          // Fallback in-memory mode if run outside environment
          isCloudConnected = false;
          document.getElementById('loading-overlay').classList.add('hidden');
          render();
        }
      } catch (err) {
        console.error("Init error:", err);
        document.getElementById('loading-overlay').classList.add('hidden');
        showToast("حدث خطأ أثناء الاتصال بقاعدة البيانات", "error");
        render();
      }
    }

    // ==========================================
    // 5. Authentication Handlers
    // ==========================================
    window.switchLoginTab = function(tab) {
      state.loginTab = tab;
      state.loginError = '';
      render();
    };

    window.handleParentLogin = function(e) {
      e.preventDefault();
      const phone = document.getElementById('parent-login-phone').value.trim();
      const pass = document.getElementById('parent-login-pass').value.trim();

      const parent = state.parents.find(p => p.phone === phone && p.password === pass);
      if (!parent) {
        state.loginError = 'رقم الهاتف أو كلمة المرور غير صحيحة. يرجى التأكد والمحاولة مرة أخرى.';
        render();
        return;
      }

      const children = state.students.filter(s => s.parentId === parent.id);
      state.loggedParentId = parent.id;
      state.selectedChildId = children.length > 0 ? children[0].id : null;
      state.selectedParentSubject = children.length > 0 && children[0].subjects?.length > 0 ? children[0].subjects[0] : null;
      state.loginError = '';
      state.view = 'parent';
      showToast(`أهلاً بك يا ${parent.name}`, 'success');
      render();
    };

    window.handleAdminLogin = function(e) {
      e.preventDefault();
      const username = document.getElementById('admin-login-user').value.trim();
      const pass = document.getElementById('admin-login-pass').value.trim();

      if (username === state.settings.adminUsername && pass === state.settings.adminPassword) {
        state.loginError = '';
        state.view = 'admin';
        state.adminTab = 'parents';
        showToast('تم تسجيل الدخول إلى لوحة الإدارة بنجاح', 'success');
        render();
      } else {
        state.loginError = 'اسم المستخدم أو كلمة المرور للإدارة غير صحيحة.';
        render();
      }
    };

    window.logout = function() {
      state.view = 'login';
      state.loggedParentId = null;
      state.selectedChildId = null;
      state.selectedParentSubject = null;
      state.loginError = '';
      showToast('تم تسجيل الخروج بنجاح', 'info');
      render();
    };

    window.fillDemoCredentials = function(type) {
      if (type === 'parent') {
        document.getElementById('parent-login-phone').value = '01012345678';
        document.getElementById('parent-login-pass').value = '1234';
      } else {
        document.getElementById('admin-login-user').value = state.settings.adminUsername || 'admin';
        document.getElementById('admin-login-pass').value = state.settings.adminPassword || '1234';
      }
    };

    // ==========================================
    // 6. Admin CRUD Handlers (Parents, Students, Settings)
    // ==========================================
    window.setAdminTab = function(tab) {
      state.adminTab = tab;
      if (tab === 'tracking' && !state.trackingStudentId && state.students.length > 0) {
        state.trackingStudentId = state.students[0].id;
        state.trackingSubject = state.students[0].subjects?.[0] || '';
      }
      render();
    };

    window.toggleAddParentForm = function() {
      state.showAddParentForm = !state.showAddParentForm;
      render();
    };

    window.toggleAddStudentForm = function() {
      state.showAddStudentForm = !state.showAddStudentForm;
      render();
    };

    // Add Parent
    window.handleAddParent = async function(e) {
      e.preventDefault();
      if (!currentUser && isCloudConnected) return;

      const name = document.getElementById('new-parent-name').value.trim();
      const phone = document.getElementById('new-parent-phone').value.trim();
      const password = document.getElementById('new-parent-pass').value.trim();
      const confirmPass = document.getElementById('new-parent-confirm').value.trim();

      if (!name || !phone || !password) {
        showToast('يرجى ملء جميع الحقول المطلوبة', 'error');
        return;
      }
      if (password !== confirmPass) {
        showToast('كلمة المرور وتأكيد كلمة المرور غير متطابقتين', 'error');
        return;
      }
      if (state.parents.some(p => p.phone === phone)) {
        showToast('رقم الهاتف مسجل بالفعل لولي أمر آخر', 'error');
        return;
      }

      const newId = generateId('parent');
      const newParent = {
        id: newId,
        name,
        phone,
        password,
        createdAt: new Date().toISOString()
      };

      try {
        if (isCloudConnected) {
          await setDoc(getPublicDoc('parents', newId), newParent);
        } else {
          state.parents.unshift(newParent);
        }
        state.showAddParentForm = false;
        showToast('تم إضافة ولي الأمر بنجاح 🎉', 'success');
        render();
      } catch (err) {
        console.error(err);
        showToast('حدث خطأ أثناء حفظ ولي الأمر', 'error');
      }
    };

    // Edit Parent Modal
    window.openEditParentModal = function(parentId) {
      const parent = state.parents.find(p => p.id === parentId);
      if (!parent) return;

      openModal(`
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
          <h3 class="text-xl font-extrabold text-blue-900 flex items-center gap-2">
            <i class="fa-solid fa-user-pen text-teal-600"></i>
            تعديل بيانات ولي الأمر
          </h3>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form onsubmit="handleUpdateParent(event, '${parent.id}')" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">اسم ولي الأمر بالكامل</label>
            <input type="text" id="edit-parent-name" value="${parent.name}" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20 outline-none font-medium" />
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">رقم الهاتف (اسم الدخول)</label>
            <input type="tel" id="edit-parent-phone" value="${parent.phone}" required dir="ltr"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20 outline-none text-right font-medium" />
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">كلمة المرور</label>
            <input type="text" id="edit-parent-pass" value="${parent.password}" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20 outline-none font-medium" />
          </div>
          <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition">إلغاء</button>

    window.saveAttendanceRecord = async function(e) {
      e.preventDefault();
      const student = state.students.find(s => s.id === state.trackingStudentId);
      const subj = state.trackingSubject;
      if (!student || !subj) return;

      const status = document.getElementById('track-att-status').value;
      const date = document.getElementById('track-att-date').value;
      if (!date) {
        showToast('يرجى تحديد التاريخ', 'error');
        return;
      }

      const records = { ...(student.records || {}) };
      const current = records[subj] || createDefaultSubjectRecord(subj);
      const history = [...(current.attendance?.history || [])];

      // Check if date already exists to update or append
      const existingIdx = history.findIndex(h => h.date === date);
      if (existingIdx > -1) {
        history[existingIdx].status = status;
      } else {
        history.unshift({ date, status });
      }

      const totalCount = history.length;
      const presentCount = history.filter(h => h.status === 'حاضر' || h.status === 'متأخر').length;

      records[subj] = {
        ...current,
        attendance: {
          status,
          lastDate: date,
          presentCount,
          totalCount,
          history: history.slice(0, 15)
        }
      };

      await persistStudentRecords(student.id, records, 'تم تسجيل حالة الحضور بنجاح ✅');
    };

      const examName = document.getElementById('track-exam-name').value.trim();

      const history = [...(current.exams?.history || [])];
      const today = new Date().toISOString().split('T')[0];

          totalPaid += Number(rec.fees?.paid || 0);

      return { totalDue, totalPaid, remaining: Math.max(0, totalDue - totalPaid) };

            </div>

    // ==========================================
    // 10. Parent Portal View
    // ==========================================
    function renderParentPortal() {
      const parent = state.parents.find(p => p.id === state.loggedParentId);
      if (!parent) {
        state.view = 'login';
        return renderLoginView();
      }

      const children = state.students.filter(s => s.parentId === parent.id);
      if (children.length > 0 && (!state.selectedChildId || !children.some(c => c.id === state.selectedChildId))) {
        state.selectedChildId = children[0].id;
      }

      const activeChild = children.find(c => c.id === state.selectedChildId);
      if (activeChild && (!state.selectedParentSubject || !activeChild.subjects.includes(state.selectedParentSubject))) {
        state.selectedParentSubject = activeChild.subjects?.[0] || null;
      }

      const activeRecord = activeChild && state.selectedParentSubject
        ? (activeChild.records?.[state.selectedParentSubject] || createDefaultSubjectRecord(state.selectedParentSubject))
        : null;

      return `
        <!-- Top Header -->
        <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-30">
          <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-teal-400 text-xl shrink-0">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <div>
                <p class="text-xs text-blue-200 font-medium">${state.settings.centerName}</p>
                <h1 class="font-extrabold text-base sm:text-lg">أهلاً بك، ${parent.name} 👋</h1>
              </div>
            </div>
            <button onclick="logout()"
              class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs sm:text-sm font-bold shadow-sm transition flex items-center gap-1.5">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>خروج</span>
            </button>
          </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-5 fade-in">
          ${children.length === 0 ? `
            <div class="bg-white rounded-3xl p-10 text-center shadow-sm border border-slate-100">
              <i class="fa-solid fa-child-reaching text-5xl text-slate-300 mb-3"></i>
              <h2 class="text-lg font-extrabold text-slate-800">لا يوجد أبناء مسجلون حالياً</h2>
              <p class="text-sm text-slate-500 mt-1">يرجى التواصل مع إدارة السنتر لربط بيانات الأبناء بحسابك.</p>
            </div>
          ` : `
            <!-- Multi-Child Switcher (Visible especially when parent has >1 child) -->
            ${children.length > 1 ? `
              <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-extrabold text-slate-500 mb-2.5 flex items-center gap-1.5">
                  <i class="fa-solid fa-children text-teal-600"></i>
                  اختر الابن لمتابعة مستواه (${children.length} أبناء):
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${children.map(child => {
                    const isSelected = child.id === activeChild.id;
                    return `
                      <button onclick="selectParentChild('${child.id}')"
                        class="p-3 rounded-xl border-2 text-right transition flex items-center gap-3 ${isSelected ? 'border-blue-900 bg-blue-50/60 shadow-sm' : 'border-slate-100 bg-slate-50/50 hover:border-slate-300'}">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-base shrink-0 ${isSelected ? 'bg-blue-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
                          <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <div class="min-w-0">
                          <p class="font-extrabold text-sm text-slate-900 truncate">${child.name}</p>
                          <p class="text-xs font-bold ${isSelected ? 'text-teal-700' : 'text-slate-500'}">${child.grade}</p>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Student Info Card -->
            <div class="bg-gradient-to-l from-blue-900 to-blue-800 text-white p-5 sm:p-6 rounded-3xl shadow-lg relative overflow-hidden">
              <div class="absolute -left-8 -bottom-8 w-36 h-36 bg-teal-400/15 rounded-full blur-2xl"></div>
              <div class="flex items-center gap-4 relative z-10">
                <div class="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-sm border border-white/20 flex items-center justify-center text-2xl text-teal-300 shrink-0">
                  <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div>
                  <span class="text-xs font-bold text-teal-300 bg-white/10 px-2.5 py-0.5 rounded-full">بيانات الطالب</span>
                  <h2 class="text-xl sm:text-2xl font-black mt-1">${activeChild.name}</h2>
                  <p class="text-sm text-blue-100 font-bold mt-0.5">
                    <i class="fa-solid fa-layer-group ml-1 text-teal-300"></i>
                    الصف الدراسي: ${activeChild.grade}
                  </p>
                </div>
              </div>
            </div>

            <!-- Subjects Selector -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
              <h3 class="text-sm font-extrabold text-blue-900 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-books text-teal-600"></i>
                مواد الطالب المسجلة (اضغط على المادة لعرض التفاصيل):
              </h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${(activeChild.subjects || []).map(subj => {
                  const isSelected = subj === state.selectedParentSubject;
                  return `
                    <button onclick="selectParentSubject('${subj}')"
                      class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-2 border ${isSelected ? 'bg-teal-600 text-white border-teal-600 shadow-md shadow-teal-600/20' : 'bg-slate-50 text-slate-700 border-slate-200/80 hover:bg-slate-100'}">
                      <i class="fa-solid fa-book-open ${isSelected ? 'text-white' : 'text-teal-600'}"></i>
                      <span class="truncate">${subj}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Subject Detailed Report -->
            ${activeRecord ? `
              <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4 fade-in">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 class="text-lg font-black text-blue-900 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-teal-600"></i>
                    تقرير مادة: ${state.selectedParentSubject}
                  </h3>
                </div>

                <!-- 1. Attendance -->
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/60 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-900 flex items-center justify-center text-lg shrink-0">
                      <i class="fa-solid fa-calendar-check"></i>
                    </div>
                    <div>
                      <p class="text-xs font-bold text-slate-500">الحضور والغياب</p>
                      <p class="text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">
                        ${activeRecord.attendance?.status || 'لم يتم التسجيل'}
                        ${activeRecord.attendance?.lastDate ? `<span class="text-xs font-normal text-slate-500 mr-1">(${activeRecord.attendance.lastDate})</span>` : ''}
                      </p>
                    </div>
                  </div>
                  ${activeRecord.attendance?.totalCount > 0 ? `
                    <span class="text-xs font-extrabold bg-blue-900 text-white px-3 py-1.5 rounded-xl">
                      نسبة الحضور ${Math.round((activeRecord.attendance.presentCount / activeRecord.attendance.totalCount) * 100)}%
                    </span>
                  ` : ''}
                </div>

                <!-- 2. Homework & Level -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/60 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center text-lg shrink-0">
                      <i class="fa-solid fa-pen-ruler"></i>
                    </div>
                    <div>
                      <p class="text-xs font-bold text-slate-500">حالة الواجب</p>
                      <p class="text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">${activeRecord.homework?.status || 'لم يتم التسجيل'}</p>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/60 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg shrink-0">
                      <i class="fa-solid fa-star"></i>
                    </div>
                    <div>
                      <p class="text-xs font-bold text-slate-500">المستوى العام</p>
                      <p class="text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">${activeRecord.homework?.level || 'لم يتم التقييم'}</p>
                    </div>
                  </div>
                </div>

                <!-- 3. Latest Exam -->
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/60">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-800 flex items-center justify-center text-lg shrink-0">
                        <i class="fa-solid fa-file-signature"></i>
                      </div>
                      <div>
                        <p class="text-xs font-bold text-slate-500">آخر اختبار</p>
                        <p class="text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">
                          ${activeRecord.exams?.latestName
                            ? `${activeRecord.exams.latestName}: <span class="text-blue-900">${activeRecord.exams.latestScore} من ${activeRecord.exams.latestMax}</span>`
                            : 'لم يتم التسجيل'}
                        </p>
                      </div>
                    </div>
                  </div>

                  ${(activeRecord.exams?.history || []).length > 1 ? `
                    <div class="mt-3 pt-3 border-t border-slate-200/70 space-y-1.5">
                      <p class="text-xs font-bold text-slate-500">سجل الاختبارات السابقة:</p>
                      ${activeRecord.exams.history.slice(1).map(ex => `
                        <div class="flex items-center justify-between text-xs bg-white px-3 py-2 rounded-xl border border-slate-100">
                          <span class="font-bold text-slate-700">${ex.name}</span>
                          <span class="font-extrabold text-blue-900">${ex.score} / ${ex.max}</span>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>

                <!-- 4. Teacher Notes -->
                <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/70 flex items-start gap-3">
                  <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg shrink-0 mt-0.5">
                    <i class="fa-solid fa-comment-dots"></i>
                  </div>
                  <div>
                    <p class="text-xs font-bold text-amber-800">ملاحظات المدرس</p>
                    <p class="text-sm font-bold text-slate-800 mt-1 leading-relaxed">
                      ${activeRecord.homework?.notes ? activeRecord.homework.notes : 'لا توجد ملاحظات مسجلة حالياً.'}
                    </p>
                  </div>
                </div>

                <!-- 5. Tuition Fees Summary -->
                ${(() => {
                  const due = Number(activeRecord.fees?.due || 0);
                  const paid = Number(activeRecord.fees?.paid || 0);
                  const rem = Math.max(0, due - paid);
                  const isPaidFull = rem === 0;
                  return `
                    <div class="p-5 rounded-2xl bg-slate-900 text-white space-y-4">
                      <div class="flex items-center justify-between">
                        <h4 class="font-extrabold text-base flex items-center gap-2">
                          <i class="fa-solid fa-coins text-amber-400"></i>
                          مصروفات المادة
                        </h4>
                        ${isPaidFull
                          ? '<span class="text-xs font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full">✅ تم السداد بالكامل</span>'
                          : '<span class="text-xs font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full">⏳ يوجد مبلغ متبقي</span>'
                        }
                      </div>

                      <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-white/10 rounded-2xl p-3">
                          <p class="text-[11px] text-slate-300 font-bold">المستحق</p>
                          <p class="text-base sm:text-lg font-black mt-0.5">${due} <span class="text-xs font-normal">جنيه</span></p>
                        </div>
                        <div class="bg-white/10 rounded-2xl p-3">
                          <p class="text-[11px] text-emerald-300 font-bold">المدفوع</p>
                          <p class="text-base sm:text-lg font-black text-emerald-400 mt-0.5">${paid} <span class="text-xs font-normal">جنيه</span></p>
                        </div>
                        <div class="bg-white/10 rounded-2xl p-3">
                          <p class="text-[11px] text-amber-300 font-bold">المتبقي</p>
                          <p class="text-base sm:text-lg font-black ${rem > 0 ? 'text-amber-400' : 'text-white'} mt-0.5">${rem} <span class="text-xs font-normal">جنيه</span></p>
                        </div>
                      </div>
                    </div>
                  `;
                })()}
              </div>
            ` : ''}
          `}
        </main>
      `;
    }

    // ==========================================
    // 11. Master Render Function
    // ==========================================
    window.render = function() {
      const appEl = document.getElementById('app');
      if (state.view === 'login') {
        appEl.innerHTML = renderLoginView();
      } else if (state.view === 'admin') {
        appEl.innerHTML = renderAdminDashboard();
      } else if (state.view === 'parent') {
        appEl.innerHTML = renderParentPortal();
      }
    };

    // Start Application
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
