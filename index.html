<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام متابعة الطلاب وأولياء الأمور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #0ea5e9;
      --success: #15803d;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .sync-status {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-light { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost { background: rgba(255,255,255,0.14); color: #fff; }
    .btn-sm { padding: 6px 11px; font-size: 0.82rem; border-radius: 8px; }

    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .login-wrapper {
      max-width: 480px;
      margin: 36px auto;
    }

    .login-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg);
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .login-tab {
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
      transition: 0.2s;
    }

    .login-tab.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    input:disabled, select:disabled, textarea:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(29, 78, 216, 0.22);
      border-color: var(--primary);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    @media (max-width: 900px) {
      .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .card { padding: 15px; }
    }

    .stat-box {
      background: var(--primary-light);
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 16px;
    }

    .stat-label { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
    .stat-value { font-size: 1.65rem; font-weight: 800; color: var(--primary-dark); margin-top: 4px; }

    .nav-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .nav-pill {
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      padding: 11px 13px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      background: #f8fafc;
      font-weight: 800;
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-info { background: var(--primary-light); color: var(--primary); }

    .subjects-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .subject-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .subject-chip input { width: auto; margin: 0; }

    .children-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .child-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .child-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .subject-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: 0.2s;
      background: #fff;
    }

    .subject-card:hover { border-color: var(--accent); }
    .subject-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title { font-size: 1.08rem; font-weight: 800; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--text);
      color: #fff;
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .lock-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span id="headerCenterName">نظام متابعة الطلاب</span>
        <span class="brand-badge" id="headerRoleBadge">بوابة الدخول</span>
        <span class="sync-status" id="syncStatus">جاري المزامنة...</span>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
  </header>

  <main class="container" id="appRoot"></main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">نافذة</h3>
        <button class="btn btn-light btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // =========================================================================
    // إعداد قاعدة البيانات السحابية Firebase Realtime Database
    // =========================================================================
    const FIREBASE_DB_URL = "https://teacher-f8c18-default-rtdb.firebaseio.com";
    const FIREBASE_DATA_ENDPOINT = `${FIREBASE_DB_URL}/teacher_portal_state.json`;
    const LOCAL_CACHE_KEY = "teacher_portal_cache_v1";

    const DEFAULT_SUBJECTS = [
      "القرآن الكريم",
      "اللغة العربية",
      "الرياضيات",
      "اللغة الإنجليزية",
      "الدراسات الاجتماعية",
      "التاريخ",
      "العلوم"
    ];

    function createDefaultData() {
      return {
        settings: {
          centerName: "سنتر التميز التعليمي",
          adminUser: "admin",
          adminPass: "1234",
          // بمجرد تغيير يوزر أو باسورد الإدارة مرة واحدة يتم قفل التعديل لمنع أي شخص من الاستيلاء على الحساب
          adminLocked: false,
          customSubjects: [...DEFAULT_SUBJECTS]
        },
        parents: [
          {
            id: "p1",
            name: "أ. محمود حسن",
            phone: "01012345678",
            password: "1234"
          },
          {
            id: "p2",
            name: "أ. كريم عادل",
            phone: "01098765432",
            password: "1234"
          }
        ],
        students: [
          {
            id: "s1",
            name: "يوسف محمود حسن",
            grade: "الصف الخامس الابتدائي",
            parentId: "p1",
            subjects: ["القرآن الكريم", "اللغة العربية", "الرياضيات", "اللغة الإنجليزية"],
            records: {
              "الرياضيات": {
                attendanceRate: "95%",
                lastStatus: "حاضر",
                homework: "ممتاز - حل الواجب كاملًا",
                level: "ممتاز",
                lastExam: "19 / 20",
                notes: "متفوق وسريع الفهم في الكسور.",
                feeDue: 300,
                feePaid: 200
              },
              "اللغة العربية": {
                attendanceRate: "90%",
                lastStatus: "حاضر",
                homework: "جيد جدًا",
                level: "جيد جدًا",
                lastExam: "18 / 20",
                notes: "يحتاج لمراجعة قواعد النحو أسبوعيًا.",
                feeDue: 250,
                feePaid: 250
              }
            }
          },
          {
            id: "s2",
            name: "مريم محمود حسن",
            grade: "الصف الثاني الإعدادي",
            parentId: "p1",
            subjects: ["اللغة العربية", "العلوم", "الدراسات الاجتماعية"],
            records: {
              "العلوم": {
                attendanceRate: "100%",
                lastStatus: "حاضر",
                homework: "ممتاز",
                level: "ممتاز",
                lastExam: "20 / 20",
                notes: "منضبطة جدًا وتشارك باستمرار.",
                feeDue: 350,
                feePaid: 350
              }
            }
          },
          {
            id: "s3",
            name: "عمر كريم عادل",
            grade: "الصف الأول الثانوي",
            parentId: "p2",
            subjects: ["الرياضيات", "اللغة الإنجليزية", "التاريخ"],
            records: {
              "اللغة الإنجليزية": {
                attendanceRate: "85%",
                lastStatus: "غائب",
                homework: "ناقص - لم يسلم آخر واجب",
                level: "متوسط",
                lastExam: "15 / 20",
                notes: "يرجى متابعة حفظ الكلمات الجديدة.",
                feeDue: 400,
                feePaid: 150
              }
            }
          }
        ]
      };
    }

    let db = createDefaultData();
    let session = {
      role: null, // 'admin' | 'parent' | null
      parentId: null,
      adminTab: "overview", // 'overview' | 'parents' | 'students' | 'followup' | 'settings'
      selectedChildId: null,
      selectedSubject: null
    };

    function setSyncStatus(text, isError = false) {
      const el = document.getElementById("syncStatus");
      if (!el) return;
      el.textContent = text;
      el.style.background = isError ? "rgba(185, 28, 28, 0.45)" : "rgba(255, 255, 255, 0.15)";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function openModal(title, htmlContent) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlContent;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function ensureStudentSubjectRecord(student, subject) {
      if (!student.records) student.records = {};
      if (!student.records[subject]) {
        student.records[subject] = {
          attendanceRate: "100%",
          lastStatus: "حاضر",
          homework: "لم يُسجل بعد",
          level: "جيد",
          lastExam: "لم يُسجل بعد",
          notes: "لا توجد ملاحظات مسجلة حاليًا.",
          feeDue: 0,
          feePaid: 0
        };
      }
      return student.records[subject];
    }

    // تحميل البيانات من Firebase عند فتح الصفحة
    async function loadFromFirebase() {
      setSyncStatus("جاري التحميل من السحابة...");
      try {
        const res = await fetch(FIREBASE_DATA_ENDPOINT, { cache: "no-store" });
        if (!res.ok) throw new Error("Network error");
        const remoteData = await res.json();

        if (remoteData && typeof remoteData === "object") {
          const def = createDefaultData();
          db = {
            settings: {
              ...def.settings,
              ...(remoteData.settings || {}),
              customSubjects: Array.isArray(remoteData.settings?.customSubjects) && remoteData.settings.customSubjects.length
                ? remoteData.settings.customSubjects
                : [...DEFAULT_SUBJECTS]
            },
            parents: Array.isArray(remoteData.parents) ? remoteData.parents : [],
            students: Array.isArray(remoteData.students) ? remoteData.students : []
          };
          localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(db));
          setSyncStatus("متصل بـ Firebase ✓");
        } else {
          // أول مرة: رفع البيانات الافتراضية إلى Firebase
          await saveToFirebase(false);
          setSyncStatus("تمت تهيئة قاعدة البيانات ✓");
        }
      } catch (err) {
        const cached = localStorage.getItem(LOCAL_CACHE_KEY);
        if (cached) {
          try {
            db = JSON.parse(cached);
          } catch (_) {}
        }
        setSyncStatus("وضع مؤقت (تحقق من قواعد Firebase)", true);
      }
      renderApp();
    }

    // حفظ البيانات في Firebase والذاكرة المحلية
    async function saveToFirebase(showMessage = true) {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(db));
      setSyncStatus("جاري الحفظ...");
      try {
        const res = await fetch(FIREBASE_DATA_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(db)
        });
        if (!res.ok) throw new Error("Save failed");
        setSyncStatus("محفوظ سحابيًا ✓");
        if (showMessage) showToast("تم حفظ التعديلات بنجاح");
      } catch (err) {
        setSyncStatus("تعذر الحفظ السحابي", true);
        if (showMessage) showToast("تم الحفظ مؤقتًا - تحقق من صلاحيات Firebase Rules");
      }
    }

    function renderTopbar() {
      document.getElementById("headerCenterName").textContent = db.settings.centerName || "نظام متابعة الطلاب";
      const badge = document.getElementById("headerRoleBadge");
      const actions = document.getElementById("topbarActions");

      if (!session.role) {
        badge.textContent = "بوابة الدخول";
        actions.innerHTML = "";
        return;
      }

      if (session.role === "admin") {
        badge.textContent = "لوحة الإدارة والمدرس";
        actions.innerHTML = `
          <button class="btn btn-ghost btn-sm" onclick="switchAdminTab('settings')">⚙️ الإعدادات</button>
          <button class="btn btn-light btn-sm" onclick="logout()">تسجيل خروج</button>
        `;
      } else if (session.role === "parent") {
        const parent = db.parents.find(p => p.id === session.parentId);
        badge.textContent = `ولي الأمر: ${parent ? parent.name : ""}`;
        actions.innerHTML = `
          <button class="btn btn-light btn-sm" onclick="logout()">تسجيل خروج</button>
        `;
      }
    }

    function logout() {
      session.role = null;
      session.parentId = null;
      session.selectedChildId = null;
      session.selectedSubject = null;
      renderApp();
      showToast("تم تسجيل الخروج");
    }

    function renderApp() {
      renderTopbar();
      if (!session.role) {
        renderLoginScreen();
      } else if (session.role === "admin") {
        renderAdminDashboard();
      } else if (session.role === "parent") {
        renderParentPortal();
      }
    }

    // =========================================================================
    // شاشة تسجيل الدخول
    // =========================================================================
    let loginMode = "parent"; // 'parent' | 'admin'

    function renderLoginScreen() {
      const root = document.getElementById("appRoot");
      root.innerHTML = `
        <div class="login-wrapper">
          <div class="card">
            <div style="text-align:center; margin-bottom:18px;">
              <h1 style="font-size:1.35rem; font-weight:800; color:var(--primary-dark);">
                ${db.settings.centerName}
              </h1>
              <p class="helper-text">اختر نوع الدخول لمتابعة الطلاب أو إدارة السنتر</p>
            </div>

            <div class="login-tabs">
              <button class="login-tab ${loginMode === "parent" ? "active" : ""}" onclick="setLoginMode('parent')">
                دخول ولي الأمر
              </button>
              <button class="login-tab ${loginMode === "admin" ? "active" : ""}" onclick="setLoginMode('admin')">
                دخول الإدارة / المدرس
              </button>
            </div>

            ${loginMode === "parent" ? `
              <form onsubmit="handleParentLogin(event)">
                <div class="form-group">
                  <label>رقم هاتف ولي الأمر</label>
                  <input type="text" id="loginPhone" placeholder="مثال: 01012345678" required />
                </div>
                <div class="form-group">
                  <label>كلمة المرور</label>
                  <input type="password" id="loginParentPass" placeholder="أدخل كلمة المرور" required />
                </div>

    function handleParentLogin(e) {
      e.preventDefault();
      const phone = document.getElementById("loginPhone").value.trim();
      const pass = document.getElementById("loginParentPass").value;
      const parent = db.parents.find(p => p.phone.trim() === phone && p.password === pass);
      if (!parent) {
        showToast("رقم الهاتف أو كلمة المرور غير صحيحة");
        return;
      }
      session.role = "parent";
      session.parentId = parent.id;
      const children = db.students.filter(s => s.parentId === parent.id);
      session.selectedChildId = children[0]?.id || null;
      session.selectedSubject = children[0]?.subjects?.[0] || null;
      renderApp();
      showToast(`مرحبًا بك يا ${parent.name}`);
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById("loginAdminUser").value.trim();
      const pass = document.getElementById("loginAdminPass").value;
      if (user === db.settings.adminUser && pass === db.settings.adminPass) {
        session.role = "admin";
        session.adminTab = "overview";
        renderApp();
        showToast("تم تسجيل دخول الإدارة بنجاح");
      } else {
        showToast("اسم المستخدم أو كلمة المرور غير صحيحة");

    }

          <button class="nav-pill ${session.adminTab === "students" ? "active" : ""}" onclick="switchAdminTab('students')">الطلاب والمواد</button>
          <button class="nav-pill ${session.adminTab === "followup" ? "active" : ""}" onclick="switchAdminTab('followup')">المتابعة والدرجات والمصروفات</button>

    async function addParent(e) {
      e.preventDefault();
      const name = document.getElementById("pName").value.trim();
      const phone = document.getElementById("pPhone").value.trim();
      const pass = document.getElementById("pPass").value;
      const passConfirm = document.getElementById("pPassConfirm").value;

      if (pass !== passConfirm) {
        showToast("كلمتا المرور غير متطابقتين");
        return;
      }
      if (db.parents.some(p => p.phone.trim() === phone)) {
        showToast("رقم الهاتف مسجل لولي أمر آخر بالفعل");
        return;
      }

      db.parents.push({
        id: "p_" + Date.now(),
        name,
        phone,
        password: pass
      });
      closeModal();
      renderAdminDashboard();
      await saveToFirebase();
    }

    function openEditParentModal(parentId) {
      const p = db.parents.find(x => x.id === parentId);
      if (!p) return;
      openModal("تعديل بيانات ولي الأمر", `
        <form onsubmit="updateParent(event, '${p.id}')">
          <div class="form-group">
            <label>اسم ولي الأمر</label>
            <input type="text" id="epName" value="${p.name}" required />
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="text" id="epPhone" value="${p.phone}" required />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="text" id="epPass" value="${p.password}" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">حفظ التعديلات</button>
        </form>
      `);
    }

    async function updateParent(e, parentId) {
      e.preventDefault();
      const p = db.parents.find(x => x.id === parentId);
      if (!p) return;
      const name = document.getElementById("epName").value.trim();
      const phone = document.getElementById("epPhone").value.trim();
      const pass = document.getElementById("epPass").value;

      if (db.parents.some(x => x.id !== parentId && x.phone.trim() === phone)) {
        showToast("هذا الرقم مستخدم لولي أمر آخر");
        return;
      }

      p.name = name;
      p.phone = phone;
      p.password = pass;
      closeModal();
      renderAdminDashboard();
      await saveToFirebase();
    }

    async function deleteParent(parentId) {
      if (!confirm("هل أنت متأكد من حذف ولي الأمر؟ سيتم فصل أبنائه المرتبطين به.")) return;
      db.parents = db.parents.filter(p => p.id !== parentId);
      db.students.forEach(s => {
        if (s.parentId === parentId) s.parentId = "";
      });
      renderAdminDashboard();
      await saveToFirebase();
    }

      openModal("إضافة طالب جديد", `

            <label>اسم الطالب</label>
            <input type="text" id="stName" required placeholder="الاسم الثلاثي للطالب" />

              <input type="text" id="stGrade" required placeholder="مثال: الصف السادس الابتدائي" />

    async function addStudent(e) {
      e.preventDefault();
      const name = document.getElementById("stName").value.trim();
      const grade = document.getElementById("stGrade").value.trim();
      const parentId = document.getElementById("stParent").value;
      const subjects = Array.from(document.querySelectorAll('input[name="studentSubject"]:checked')).map(i => i.value);

      if (!subjects.length) {
        showToast("اختر مادة واحدة على الأقل للطالب");
        return;
      }

      const newStudent = {
        id: "s_" + Date.now(),
        name,
        grade,
        parentId,
        subjects,
        records: {}
      };
      subjects.forEach(sub => ensureStudentSubjectRecord(newStudent, sub));

      db.students.push(newStudent);
      closeModal();
      renderAdminDashboard();
      await saveToFirebase();
    }

    function openEditStudentModal(studentId) {
      const st = db.students.find(x => x.id === studentId);
      if (!st) return;
      openModal("تعديل بيانات الطالب ومواده", `
        <form onsubmit="updateStudent(event, '${st.id}')">
          <div class="form-group">
            <label>اسم الطالب</label>
            <input type="text" id="estName" value="${st.name}" required />
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>الصف الدراسي</label>
              <input type="text" id="estGrade" value="${st.grade}" required />
            </div>
            <div class="form-group">
              <label>ولي الأمر</label>
              <select id="estParent" required>
                ${db.parents.map(p => `<option value="${p.id}" ${p.id === st.parentId ? "selected" : ""}>${p.name} (${p.phone})</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>المواد الدراسية</label>
            ${renderSubjectsCheckboxes(st.subjects || [])}
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">حفظ التعديلات</button>
        </form>
      `);
    }

    async function updateStudent(e, studentId) {
      e.preventDefault();
      const st = db.students.find(x => x.id === studentId);
      if (!st) return;
      const name = document.getElementById("estName").value.trim();
      const grade = document.getElementById("estGrade").value.trim();
      const parentId = document.getElementById("estParent").value;
      const subjects = Array.from(document.querySelectorAll('input[name="studentSubject"]:checked')).map(i => i.value);

      if (!subjects.length) {
        showToast("اختر مادة واحدة على الأقل");
        return;
      }

      st.name = name;
      st.grade = grade;
      st.parentId = parentId;
      st.subjects = subjects;
      subjects.forEach(sub => ensureStudentSubjectRecord(st, sub));

      closeModal();
      renderAdminDashboard();
      await saveToFirebase();
    }

    async function deleteStudent(studentId) {
      if (!confirm("هل أنت متأكد من حذف هذا الطالب وجميع بيانات متابعته؟")) return;
      db.students = db.students.filter(s => s.id !== studentId);
      renderAdminDashboard();
      await saveToFirebase();
    }

            <div class="grid-3">
              <div class="form-group">
                <label>المصروفات المستحقة للمادة (ج)</label>
                <input type="number" id="fFeeDue" value="${rec.feeDue || 0}" min="0" />
              </div>
              <div class="form-group">
                <label>المدفوع (ج)</label>
                <input type="number" id="fFeePaid" value="${rec.feePaid || 0}" min="0" />
              </div>
              <div class="form-group">
                <label>المتبقي (ج)</label>
                <input type="text" value="${remaining} ج" disabled />
              </div>
            </div>

            <div class="form-group">
              <label>ملاحظات المدرس لولي الأمر</label>
              <textarea id="fNotes" rows="2" placeholder="اكتب ملاحظاتك هنا...">${rec.notes || ""}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">حفظ بيانات المتابعة والمصروفات</button>
          </form>
        </div>
      `;
    }

    function onFollowupStudentChange(id) {
      session.selectedChildId = id;
      const st = db.students.find(x => x.id === id);
      session.selectedSubject = st?.subjects?.[0] || DEFAULT_SUBJECTS[0];
      renderFollowupSection();
    }

    function onFollowupSubjectChange(sub) {
      session.selectedSubject = sub;
      renderFollowupSection();
    }

    async function saveFollowupRecord(e) {
      e.preventDefault();
      const st = db.students.find(x => x.id === session.selectedChildId);
      if (!st) return;
      const rec = ensureStudentSubjectRecord(st, session.selectedSubject);

      rec.lastStatus = document.getElementById("fStatus").value;
      rec.attendanceRate = document.getElementById("fRate").value.trim() || "100%";
      rec.lastExam = document.getElementById("fExam").value.trim() || "لم يُسجل بعد";
      rec.homework = document.getElementById("fHomework").value.trim() || "لم يُسجل بعد";
      rec.level = document.getElementById("fLevel").value;
      rec.feeDue = Number(document.getElementById("fFeeDue").value || 0);
      rec.feePaid = Number(document.getElementById("fFeePaid").value || 0);
      rec.notes = document.getElementById("fNotes").value.trim();

      renderFollowupSection();
      await saveToFirebase();
    }

    // إعدادات السنتر والمواد وقفل بيانات الإدارة
    function renderSettingsSection() {
      const box = document.getElementById("adminTabContent");
      const isLocked = Boolean(db.settings.adminLocked);

      box.innerHTML = `
        <div class="card">
          <div class="card-title">إعدادات السنتر وتأمين حساب الإدارة</div>

          ${isLocked ? `
            <div class="lock-banner">
              🔒 تم قفل تغيير اسم المستخدم وكلمة المرور للإدارة بعد التخصيص الأول؛ فلا يمكن لأي شخص تعديل بيانات دخول الإدارة من داخل الصفحة.
            </div>
          ` : `
            <div class="lock-banner">
              ⚠️ ملاحظة أمان: بمجرد تعديل اسم المستخدم أو كلمة المرور وحفظها لأول مرة، سيتم قفل هذا القسم تلقائيًا حتى لا يتمكن أي شخص من تغيير بيانات الإدارة.
            </div>
          `}

          <form onsubmit="saveSettings(event)">
            <div class="form-group">
              <label>اسم السنتر / المدرس</label>
              <input type="text" id="setCenterName" value="${db.settings.centerName}" required />
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label>اسم مستخدم الإدارة ${isLocked ? "(مقفل 🔒)" : ""}</label>
                <input type="text" id="setAdminUser" value="${db.settings.adminUser}" required ${isLocked ? "disabled" : ""} />
              </div>
              <div class="form-group">
                <label>كلمة مرور الإدارة ${isLocked ? "(مقفل 🔒)" : ""}</label>
                <input type="text" id="setAdminPass" value="${db.settings.adminPass}" required ${isLocked ? "disabled" : ""} />
              </div>
            </div>

            <div class="form-group">
              <label>المواد الدراسية المتاحة (مفصولة بفاصلة)</label>
              <input type="text" id="setSubjects" value="${(db.settings.customSubjects || DEFAULT_SUBJECTS).join("، ")}" required />
            </div>

            <button type="submit" class="btn btn-primary">حفظ الإعدادات</button>
          </form>
        </div>
      `;
    }

    async function saveSettings(e) {
      e.preventDefault();
      const newCenterName = document.getElementById("setCenterName").value.trim();
      const subjectsRaw = document.getElementById("setSubjects").value;
      const parsedSubjects = subjectsRaw
        .split(/[,،]/)
        .map(s => s.trim())
        .filter(Boolean);

      if (!parsedSubjects.length) {
        showToast("أدخل مادة دراسية واحدة على الأقل");
        return;
      }

      db.settings.centerName = newCenterName || "سنتر التميز التعليمي";
      db.settings.customSubjects = parsedSubjects;

      // إذا لم يكن مقفلًا بعد، نتحقق هل قام المستخدم بتغيير اليوزر أو الباسورد الافتراضي
      if (!db.settings.adminLocked) {
        const userInput = document.getElementById("setAdminUser");
        const passInput = document.getElementById("setAdminPass");
        const newUser = userInput ? userInput.value.trim() : db.settings.adminUser;
        const newPass = passInput ? passInput.value : db.settings.adminPass;

        if (newUser !== "admin" || newPass !== "1234") {
          db.settings.adminUser = newUser;
          db.settings.adminPass = newPass;
          db.settings.adminLocked = true;
          showToast("تم حفظ بيانات الإدارة وقفلها ضد أي تعديل خارجي");
        }
      }

      renderTopbar();
      renderSettingsSection();
      await saveToFirebase(false);
    }

    // =========================================================================
    // بوابة ولي الأمر (مع دعم تعدد الأبناء)
    // =========================================================================
    function renderParentPortal() {
      const root = document.getElementById("appRoot");
      const parent = db.parents.find(p => p.id === session.parentId);
      const children = db.students.filter(s => s.parentId === session.parentId);

      if (!children.length) {
        root.innerHTML = `
          <div class="card">
            <div class="card-title">مرحبًا ${parent ? parent.name : "ولي الأمر"}</div>
            <p>لا يوجد أبناء مسجلون تحت هذا الحساب حاليًا. يرجى التواصل مع الإدارة.</p>
          </div>
        `;
        return;
      }

      const activeChild = children.find(c => c.id === session.selectedChildId) || children[0];
      session.selectedChildId = activeChild.id;

      const subjects = activeChild.subjects?.length ? activeChild.subjects : [];
      const activeSubject = subjects.includes(session.selectedSubject) ? session.selectedSubject : (subjects[0] || null);
      session.selectedSubject = activeSubject;

      const rec = activeSubject ? ensureStudentSubjectRecord(activeChild, activeSubject) : null;
      const remaining = rec ? Math.max(0, Number(rec.feeDue || 0) - Number(rec.feePaid || 0)) : 0;

      root.innerHTML = `
        <div class="card">
          <div class="card-title">
            <span>أهلًا بك يا ${parent ? parent.name : "ولي الأمر"}</span>
            <span class="badge badge-info">عدد الأبناء المسجلين: ${children.length}</span>
          </div>

          <label style="margin-bottom:8px;">اختر الابن لمتابعة بياناته:</label>
          <div class="children-bar">
            ${children.map(child => `
              <button class="child-btn ${child.id === activeChild.id ? "active" : ""}" onclick="selectParentChild('${child.id}')">
                ${child.name} <span style="font-weight:600; color:var(--muted);">(${child.grade})</span>
              </button>
            `).join("")}
          </div>

          <div style="background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:14px;">
            <b>الاسم:</b> ${activeChild.name} &nbsp;|&nbsp;
            <b>الصف الدراسي:</b> ${activeChild.grade} &nbsp;|&nbsp;
            <b>عدد المواد:</b> ${subjects.length}
          </div>
        </div>

        <div class="card">
          <div class="card-title">المواد الدراسية للطالب (${activeChild.name})</div>
          ${subjects.length ? `
            <div class="subjects-grid">
              ${subjects.map(sub => {
                const r = ensureStudentSubjectRecord(activeChild, sub);
                return `
                  <div class="subject-card ${sub === activeSubject ? "active" : ""}" onclick="selectParentSubject('${sub.replace(/'/g, "\\'")}')">
                    <div style="font-weight:800; font-size:1rem; margin-bottom:6px;">${sub}</div>
                    <div style="font-size:0.82rem; color:var(--muted);">الحضور: <b>${r.attendanceRate || "100%"}</b></div>
                    <div style="font-size:0.82rem; color:var(--muted);">آخر اختبار: <b>${r.lastExam || "—"}</b></div>
                  </div>
                `;
              }).join("")}
            </div>
          ` : `<p>لا توجد مواد مسجلة لهذا الطالب حاليًا.</p>`}

          ${rec ? `
            <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;" />
            <h3 style="font-size:1.05rem; font-weight:800; margin-bottom:12px; color:var(--primary-dark);">
              تفاصيل مادة: ${activeSubject}
            </h3>

            <div class="grid-4" style="margin-bottom:14px;">
              <div class="stat-box">
                <div class="stat-label">الحضور ونسبته</div>
                <div class="stat-value" style="font-size:1.25rem;">${rec.lastStatus} (${rec.attendanceRate})</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">الواجب المنزلي</div>
                <div class="stat-value" style="font-size:1.15rem;">${rec.homework}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">المستوى العام</div>
                <div class="stat-value" style="font-size:1.2rem;">${rec.level}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">نتيجة آخر اختبار</div>
                <div class="stat-value" style="font-size:1.2rem;">${rec.lastExam}</div>
              </div>
            </div>

            <div class="grid-3" style="margin-bottom:14px;">
              <div class="card" style="margin-bottom:0; padding:14px;">
                <div class="stat-label">المصروفات المستحقة</div>
                <div style="font-size:1.25rem; font-weight:800;">${rec.feeDue || 0} ج</div>
              </div>
              <div class="card" style="margin-bottom:0; padding:14px;">
                <div class="stat-label">المدفوع</div>
                <div style="font-size:1.25rem; font-weight:800; color:var(--success);">${rec.feePaid || 0} ج</div>
              </div>
              <div class="card" style="margin-bottom:0; padding:14px;">
                <div class="stat-label">المتبقي</div>
                <div style="font-size:1.25rem; font-weight:800; color:${remaining > 0 ? "var(--danger)" : "var(--success)"};">${remaining} ج</div>
              </div>
            </div>

            <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:12px 14px;">
              <b>ملاحظات المدرس:</b> ${rec.notes || "لا توجد ملاحظات حالية."}
            </div>
          ` : ""}
        </div>
      `;
    }

    function selectParentChild(childId) {
      session.selectedChildId = childId;
      const child = db.students.find(s => s.id === childId);
      session.selectedSubject = child?.subjects?.[0] || null;
      renderParentPortal();
    }

    function selectParentSubject(subject) {
      session.selectedSubject = subject;
      renderParentPortal();
    }

    loadFromFirebase();
  </script>
</body>
</html>
